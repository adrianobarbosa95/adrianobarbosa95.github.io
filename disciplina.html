<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Disciplinas | Prof. Adriano Barbosa</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    header {
      background: #1f2937;
      color: #fff;
      padding: 30px 20px;
      text-align: center;
    }

    main {
      max-width: 1200px;
      margin: auto;
      padding: 40px 20px;
    }

    h2, h3 { margin-top: 30px; }

    select, input, button {
      padding: 10px;
      font-size: 1rem;
      margin-top: 10px;
      max-width: 360px;
      width: 100%;
    }

    button {
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover { background: #1d4ed8; }

    .hidden { display: none; }
    .error { color: #dc2626; margin-top: 10px; }

    .disciplina {
      background: #fff;
      padding: 20px;
      border-radius: 14px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.08);
      margin-top: 40px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }

    th, td {
      border: 1px solid #e5e7eb;
      padding: 8px;
      text-align: center;
      font-size: 0.9rem;
    }

    th { background: #f9fafb; }

    a {
      color: #2563eb;
      font-weight: 600;
      text-decoration: none;
    }
  </style>
</head>

<body>

<header>
  <h1>📚 Disciplinas</h1>
  <p>Ambiente genérico de materiais didáticos</p>
</header>

<main>

  <h2>📅 Ano</h2>
  <select id="ano"></select>

  <h2>🎓 Modalidade</h2>
  <select id="modalidade" disabled></select>

  <div id="senhaBox" class="hidden">
    <h2>🔐 Senha</h2>
    <input type="password" id="senhaInput" placeholder="Senha da modalidade">
    <button id="btnSenha">Acessar</button>
    <div id="erroSenha" class="error hidden">Senha incorreta</div>
  </div>

  <div id="turmaBox" class="hidden">
    <h2>👥 Turma</h2>
    <select id="turma"></select>
  </div>

  <div id="disciplinas" class="hidden"></div>

  <div id="voltarBox" class="hidden" style="margin-top:20px;">
    <button id="btnVoltar">⬅ Voltar</button>
  </div>

</main>

<script>
/* ======================================================
   ESTRUTURA TOTALMENTE GENÉRICA (IDs + Nomes)
====================================================== */

const sistema = {
  anos: {
    "2026": {
      modalidades: {
        "m1": {
          nome: "Modalidade 1",
          senha: "123",
          turmas: {
            "t1": {
              nome: "Turma 1",
              disciplinas: {
                "d1": { nome: "Disciplina 1" },
                "d2": { nome: "Disciplina 2" }
              }
            }
          }
        }
      }
    }
  }
};

/* ======================================================
   ELEMENTOS
====================================================== */
const anoSel = document.getElementById("ano");
const modalidadeSel = document.getElementById("modalidade");
const turmaSel = document.getElementById("turma");
const disciplinasDiv = document.getElementById("disciplinas");

const senhaBox = document.getElementById("senhaBox");
const senhaInput = document.getElementById("senhaInput");
const erroSenha = document.getElementById("erroSenha");

const turmaBox = document.getElementById("turmaBox");
const voltarBox = document.getElementById("voltarBox");

/* ======================================================
   HELPERS
====================================================== */
function option(value, text) {
  const o = document.createElement("option");
  o.value = value;
  o.textContent = text;
  return o;
}

function linkOuTraco(url, texto) {
  return url ? `<a href="${url}" target="_blank">${texto}</a>` : "—";
}

/* ======================================================
   POPULAR ANOS
====================================================== */
anoSel.innerHTML = '<option value="">Selecione</option>';
Object.keys(sistema.anos).forEach(a =>
  anoSel.appendChild(option(a, a))
);

/* ======================================================
   EVENTOS
====================================================== */
anoSel.onchange = () => {
  modalidadeSel.innerHTML = '<option value="">Selecione</option>';
  modalidadeSel.disabled = !anoSel.value;

  senhaBox.classList.add("hidden");
  turmaBox.classList.add("hidden");
  disciplinasDiv.classList.add("hidden");

  if (!anoSel.value) return;

  const modalidades = sistema.anos[anoSel.value].modalidades;
  Object.entries(modalidades).forEach(([id, m]) =>
    modalidadeSel.appendChild(option(id, m.nome))
  );
};

modalidadeSel.onchange = () => {
  senhaBox.classList.remove("hidden");
  erroSenha.classList.add("hidden");
  senhaInput.value = "";
};

document.getElementById("btnSenha").onclick = () => {
  const mod = sistema.anos[anoSel.value].modalidades[modalidadeSel.value];
  if (senhaInput.value === mod.senha) {
    senhaBox.classList.add("hidden");
    turmaBox.classList.remove("hidden");

    turmaSel.innerHTML = '<option value="">Selecione</option>';
    Object.entries(mod.turmas).forEach(([id, t]) =>
      turmaSel.appendChild(option(id, t.nome))
    );
  } else {
    erroSenha.classList.remove("hidden");
  }
};

turmaSel.onchange = () => {
  disciplinasDiv.innerHTML = "";
  disciplinasDiv.classList.add("hidden");

  if (!turmaSel.value) return;

  const turma =
    sistema.anos[anoSel.value]
      .modalidades[modalidadeSel.value]
      .turmas[turmaSel.value];

  Object.entries(turma.disciplinas).forEach(([id, d]) => {
    const bloco = document.createElement("div");
    bloco.className = "disciplina";

    bloco.innerHTML = `
      <h2>📘 ${d.nome}</h2>
      ${gerarTabela()}
    `;
    disciplinasDiv.appendChild(bloco);
  });

  disciplinasDiv.classList.remove("hidden");
  voltarBox.classList.remove("hidden");
};

document.getElementById("btnVoltar").onclick = () => {
  disciplinasDiv.classList.add("hidden");
  voltarBox.classList.add("hidden");
  turmaSel.value = "";
};

/* ======================================================
   TABELA GENÉRICA
====================================================== */
function gerarTabela() {
  let html = "<table><tr><th>Aula</th><th>Slide</th><th>Material</th><th>Atividade</th></tr>";

  for (let i = 1; i <= 10; i++) {
    html += `
      <tr>
        <td>Aula ${i}</td>
        <td>${linkOuTraco(null, "Slides")}</td>
        <td>${linkOuTraco(null, "Material")}</td>
        <td>${linkOuTraco(null, "Atividade")}</td>
      </tr>
    `;
  }

  html += "</table>";
  return html;
}
</script>

</body>
</html>
