<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Disciplinas | Prof. Adriano Barbosa</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    header {
      background: #1f2937;
      color: #fff;
      padding: 30px 20px;
      text-align: center;
    }

    main {
      max-width: 1200px;
      margin: auto;
      padding: 40px 20px;
    }

    h2 { margin-top: 30px; }

    select, button {
      padding: 10px;
      font-size: 1rem;
      margin-top: 10px;
      max-width: 360px;
      width: 100%;
    }

    button {
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover { background: #1d4ed8; }

    .hidden { display: none; }

    .disciplina {
      background: #fff;
      padding: 20px;
      border-radius: 14px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.08);
      margin-top: 30px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }

    th, td {
      border: 1px solid #e5e7eb;
      padding: 8px;
      text-align: center;
      font-size: 0.9rem;
    }

    th { background: #f9fafb; }

    a {
      color: #2563eb;
      font-weight: 600;
      text-decoration: none;
    }
  </style>
</head>

<body>

<header>
  <h1>📚 Disciplinas</h1>
  <p>Organização de materiais didáticos</p>
</header>

<main>

  <h2>🎓 Modalidade</h2>
  <select id="modalidade"></select>

  <h2>👥 Turma</h2>
  <select id="turma" disabled></select>

  <div id="conteudo" class="hidden"></div>

</main>

<script>
let sistema = {};

const modalidadeSel = document.getElementById("modalidade");
const turmaSel = document.getElementById("turma");
const conteudo = document.getElementById("conteudo");

fetch("data/dados.json")
  .then(res => res.json())
  .then(data => {
    sistema = data;
    carregarModalidades();
  });

function option(v, t) {
  const o = document.createElement("option");
  o.value = v;
  o.textContent = t;
  return o;
}

function carregarModalidades() {
  modalidadeSel.innerHTML = '<option value="">Selecione</option>';
  Object.entries(sistema.modalidades).forEach(([id, m]) => {
    modalidadeSel.appendChild(option(id, m.nome));
  });
}

modalidadeSel.onchange = () => {
  turmaSel.innerHTML = '<option value="">Selecione</option>';
  turmaSel.disabled = !modalidadeSel.value;
  conteudo.classList.add("hidden");
  conteudo.innerHTML = "";

  if (!modalidadeSel.value) return;

  const turmas = sistema.modalidades[modalidadeSel.value].turmas;
  Object.entries(turmas).forEach(([id, t]) => {
    turmaSel.appendChild(option(id, t.nome));
  });
};

turmaSel.onchange = () => {
  conteudo.innerHTML = "";
  conteudo.classList.add("hidden");

  if (!turmaSel.value) return;

  const turma =
    sistema.modalidades[modalidadeSel.value].turmas[turmaSel.value];

  turma.disciplinas.forEach(d => {
    const bloco = document.createElement("div");
    bloco.className = "disciplina";
    bloco.innerHTML = `
      <h2>📘 ${d}</h2>
      ${tabelaAulas()}
    `;
    conteudo.appendChild(bloco);
  });

  conteudo.classList.remove("hidden");
};

function tabelaAulas() {
  let html = "<table><tr><th>Aula</th><th>Slides</th><th>Material</th><th>Atividade</th></tr>";
  for (let i = 1; i <= 10; i++) {
    html += `
      <tr>
        <td>Aula ${i}</td>
        <td>—</td>
        <td>—</td>
        <td>—</td>
      </tr>`;
  }
  html += "</table>";
  return html;
}
</script>

</body>
</html>
